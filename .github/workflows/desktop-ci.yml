name: Desktop CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            platform: win
            arch: x64
          - name: macOS Apple Silicon
            os: macos-15
            platform: mac
            arch: arm64
          - name: macOS Intel
            os: macos-15-intel
            platform: mac
            arch: x64
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      GITCAT_UI_SCREENSHOTS: release/ui-screenshots
      GITCAT_UI_DEBUG: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install macOS icon renderer
        if: runner.os == 'macOS'
        run: command -v rsvg-convert || brew install librsvg
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Desktop UI checks
        run: node scripts/check-ui.cjs
      - name: Welcome layout checks
        run: node scripts/check-welcome.cjs
      - name: Generate app icon
        run: npm run icons
      - name: Package unsigned application
        run: npx --no-install electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GitCat-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload UI diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UI-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: release/ui-screenshots/
          if-no-files-found: ignore
          retention-days: 7

  preview:
    name: Publish public preview
    needs: desktop
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download installers from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: GitCat-*-${{ github.sha }}
          path: public-preview
          merge-multiple: true
      - name: Verify all platforms and prepare release notes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync, statSync, writeFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const builds = [
            ['Windows installer', `GitCat-${version}-win-x64-setup.exe`],
            ['Windows portable', `GitCat-${version}-win-x64-portable.exe`],
            ['Apple Silicon Mac DMG', `GitCat-${version}-mac-arm64.dmg`],
            ['Apple Silicon Mac ZIP', `GitCat-${version}-mac-arm64.zip`],
            ['Intel Mac DMG', `GitCat-${version}-mac-x64.dmg`],
            ['Intel Mac ZIP', `GitCat-${version}-mac-x64.zip`],
          ];
          assert.deepEqual(readdirSync('public-preview').sort(), builds.map(([, name]) => name).sort(), 'All six installers must be present');
          for (const [, name] of builds) assert.ok(statSync(`public-preview/${name}`).size > 0, `${name} is empty`);
          const tag = `preview-${process.env.GITHUB_SHA}`;
          const base = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`;
          writeFileSync('preview-notes.md', [
            'An automated preview of GitCat. These installers passed the Windows x64, Apple Silicon Mac, and Intel Mac test and build jobs.',
            '',
            ...builds.map(([label, name]) => `- [${label}](${base}/releases/download/${tag}/${name})`),
            '',
            'Install Git separately before using GitCat. These preview builds are unsigned; Windows or macOS may display a security warning. macOS builds are not notarized.',
            '',
            'SHA256SUMS.txt contains checksums for all six downloads. Older previews remain available on the Releases page.',
            '',
            `Commit: ${process.env.GITHUB_SHA}`,
            `Validation: ${base}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          ].join('\n'));
          NODE
          (cd public-preview && sha256sum *.exe *.dmg *.zip > SHA256SUMS.txt)
      - name: Publish complete preview
        shell: bash
        run: |
          tag="preview-${GITHUB_SHA}"
          # Resume an interrupted draft, but leave an already published build intact.
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = false ]; then
              echo "Preview already published: $tag"
              exit 0
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --latest=false \
              --title "GitCat preview ${GITHUB_SHA:0:7}" --notes-file preview-notes.md
          fi
          gh release upload "$tag" public-preview/* --clobber
          gh release edit "$tag" --draft=false --prerelease --latest=false --notes-file preview-notes.md
          echo "Public downloads: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
