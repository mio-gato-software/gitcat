name: Desktop CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep this workflow path and name so release versions retain their counter.
  desktop:
    uses: ./.github/workflows/desktop-build.yml

  preview:
    name: Publish public preview
    needs: desktop
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Calculate CI app version
        run: |
          version=$(node scripts/ci-version.mjs)
          echo "GITCAT_BUILD_VERSION=$version" >> "$GITHUB_ENV"
      - name: Download installers from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: GitCat-*-win-x64-${{ github.sha }}
          path: public-preview
          merge-multiple: true
      - name: Verify Windows downloads and prepare release notes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, statSync, writeFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const version = process.env.GITCAT_BUILD_VERSION;
          const builds = [
            ['Windows installer', `GitCat-${version}-win-x64-setup.exe`],
            ['Windows portable', `GitCat-${version}-win-x64-portable.exe`],
          ];
          assert.deepEqual(readdirSync('public-preview').sort(), builds.map(([, name]) => name).sort(), 'Only the two Windows downloads may be published');
          for (const [, name] of builds) assert.ok(statSync(`public-preview/${name}`).size > 0, `${name} is empty`);
          const tag = `preview-${version}`;
          const base = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`;
          writeFileSync('preview-notes.md', [
            'An automated Windows preview of GitCat. Windows x64, Apple Silicon Mac, and Intel Mac test and build jobs passed.',
            '',
            ...builds.map(([label, name]) => `- [${label}](${base}/releases/download/${tag}/${name})`),
            '',
            'Install Git separately before using GitCat. These Windows preview builds are unsigned; Windows may display a security warning.',
            '',
            'Mac downloads are unavailable until Developer ID signing, Apple notarization, and Gatekeeper verification are in place. Previous unsigned Mac downloads were withdrawn because macOS can report them as damaged. Mac users can build from source for local use.',
            '',
            'SHA256SUMS.txt contains checksums for both Windows downloads. Older previews remain available on the Releases page.',
            '',
            `Version: ${version}`,
            `Commit: ${process.env.GITHUB_SHA}`,
            `Validation: ${base}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          ].join('\n'));
          NODE
          (cd public-preview && sha256sum *.exe > SHA256SUMS.txt)
      - name: Publish complete preview
        shell: bash
        run: |
          tag="preview-${GITCAT_BUILD_VERSION}"
          # Resume an interrupted draft, but leave an already published build intact.
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = false ]; then
              echo "Preview already published: $tag"
              exit 0
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --latest=false \
              --title "GitCat ${GITCAT_BUILD_VERSION} preview" --notes-file preview-notes.md
          fi
          gh release upload "$tag" public-preview/* --clobber
          gh release edit "$tag" --draft=false --prerelease --latest=false --notes-file preview-notes.md
          echo "Public downloads: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
